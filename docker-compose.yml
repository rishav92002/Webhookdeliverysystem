services:
  postgres:
    image: postgres:16
    container_name: webhook-postgres
    restart: always
    environment:
      POSTGRES_USER: webhook_user
      POSTGRES_PASSWORD: webhook_password
      POSTGRES_DB: webhook_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: webhook-redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data: